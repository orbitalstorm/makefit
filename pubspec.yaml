name: makefit
description: "MakeFit (Remise en Forme 40+ • 10 Min Max) — Application Flutter de remise en forme quotidienne guidée, animée et motivante sans matériel."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/thumbnails/
    - assets/vectors/
