<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="rank-lit" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rank-dark" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rank-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="rank-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <g id="base-shadow">
    <polygon points="256,28 456,108 424,368 256,488 88,368 56,108" fill="#020408" opacity="0.65"/>
  </g>

  <g id="main-body">
    <!-- Outer Shield Frame -->
    <polygon points="256,20 448,98 418,358 256,476 94,358 64,98"
             fill="url(#shield-bg)" stroke="url(#rank-lit)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Inner Tactical Bevel -->
    <polygon points="256,42 426,112 400,346 256,452 112,346 86,112"
             fill="none" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.45"/>
    <!-- Corner Rivets -->
    <g fill="#0F172A" stroke="#6EE7B7" stroke-width="2.5">
      <circle cx="256" cy="36" r="5"/>
      <circle cx="432" cy="106" r="5"/>
      <circle cx="404" cy="350" r="5"/>
      <circle cx="108" cy="350" r="5"/>
      <circle cx="80" cy="106" r="5"/>
    </g>
  </g>

  <g id="rank-insignia">
    
        
    <g>
      <polygon points="256,106 144,175.44 144,199.44 256,130" fill="url(#rank-lit)"/>
      <polygon points="256,106 368,175.44 368,199.44 256,130" fill="url(#rank-dark)"/>
      <polygon points="256,106 368,175.44 368,199.44 256,130 144,199.44 144,175.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        
    <g>
      <polygon points="256,145 144,214.44 144,238.44 256,169" fill="url(#rank-lit)"/>
      <polygon points="256,145 368,214.44 368,238.44 256,169" fill="url(#rank-dark)"/>
      <polygon points="256,145 368,214.44 368,238.44 256,169 144,238.44 144,214.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        
    <g>
      <polygon points="256,184 144,253.44 144,277.44 256,208" fill="url(#rank-lit)"/>
      <polygon points="256,184 368,253.44 368,277.44 256,208" fill="url(#rank-dark)"/>
      <polygon points="256,184 368,253.44 368,277.44 256,208 144,277.44 144,253.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        <rect x="206" y="258" width="100" height="18" rx="4" fill="url(#rank-accent)" stroke="#FEF08A" stroke-width="2"/>
        
    <g>
      <path d="M 144,277.68 Q 256,318 368,277.68 L 368,297.68 Q 256,338 144,297.68 Z"
            fill="url(#rank-lit)" stroke="url(#rank-stroke)" stroke-width="2" stroke-linejoin="round"/>
    </g>
        
    <g>
      <path d="M 144,307.68 Q 256,348 368,307.68 L 368,327.68 Q 256,368 144,327.68 Z"
            fill="url(#rank-lit)" stroke="url(#rank-stroke)" stroke-width="2" stroke-linejoin="round"/>
    </g>
      
  </g>

  <g id="specular-highlights">
    <!-- Rank Code Cartouche -->
    <polygon points="154,366 358,366 338,414 174,414" fill="#0A0E14" stroke="#10B981" stroke-width="3" stroke-linejoin="round"/>
    <text x="256" y="400" font-family="Roboto" font-weight="900" font-size="30" letter-spacing="3" fill="#F8FAFC" text-anchor="middle">E-6</text>
  </g>
</svg>