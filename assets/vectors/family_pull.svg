<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="fam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <g id="base-shadow">
    <rect x="36" y="36" width="440" height="440" rx="88" fill="url(#fam-bg)" stroke="url(#fam-grad)" stroke-width="10"/>
    <rect x="58" y="58" width="396" height="396" rx="70" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.35"/>
  </g>
  <g id="main-body">
    
      <!-- Scapular Retraction Wings & Spinal Convergence Arrows -->
      <polygon points="112,138 224,186 206,318 138,274" fill="url(#fam-grad)" stroke="#A5F3FC" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="400,138 288,186 306,318 374,274" fill="url(#fam-grad)" stroke="#A5F3FC" stroke-width="3" stroke-linejoin="round"/>
      <line x1="256" y1="108" x2="256" y2="342" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 10"/>
      <polygon points="236,226 176,196 176,256" fill="#FEF08A"/>
      <polygon points="276,226 336,196 336,256" fill="#FEF08A"/>
    
  </g>
  <g id="specular-highlights">
