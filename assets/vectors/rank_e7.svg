<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="rank-lit" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rank-dark" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rank-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="rank-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <g id="base-shadow">
    <polygon points="256,28 456,108 424,368 256,488 88,368 56,108" fill="#020408" opacity="0.65"/>
  </g>

  <g id="main-body">
    <!-- Outer Shield Frame -->
    <polygon points="256,20 448,98 418,358 256,476 94,358 64,98"
             fill="url(#shield-bg)" stroke="url(#rank-lit)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Inner Tactical Bevel -->
    <polygon points="256,42 426,112 400,346 256,452 112,346 86,112"
             fill="none" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.45"/>
    <!-- Corner Rivets -->
    <g fill="#0F172A" stroke="#6EE7B7" stroke-width="2.5">
      <circle cx="256" cy="36" r="5"/>
      <circle cx="432" cy="106" r="5"/>
      <circle cx="404" cy="350" r="5"/>
      <circle cx="108" cy="350" r="5"/>
      <circle cx="80" cy="106" r="5"/>
    </g>
  </g>

  <g id="rank-insignia">
    
        
    <g>
      <polygon points="256,98 144,167.44 144,190.44 256,121" fill="url(#rank-lit)"/>
      <polygon points="256,98 368,167.44 368,190.44 256,121" fill="url(#rank-dark)"/>
      <polygon points="256,98 368,167.44 368,190.44 256,121 144,190.44 144,167.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        
    <g>
      <polygon points="256,134 144,203.44 144,226.44 256,157" fill="url(#rank-lit)"/>
      <polygon points="256,134 368,203.44 368,226.44 256,157" fill="url(#rank-dark)"/>
      <polygon points="256,134 368,203.44 368,226.44 256,157 144,226.44 144,203.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        
    <g>
      <polygon points="256,170 144,239.44 144,262.44 256,193" fill="url(#rank-lit)"/>
      <polygon points="256,170 368,239.44 368,262.44 256,193" fill="url(#rank-dark)"/>
      <polygon points="256,170 368,239.44 368,262.44 256,193 144,262.44 144,239.44"
               fill="none" stroke="url(#rank-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
        <polygon points="256.0,230.0 262.9,248.5 282.6,249.3 267.2,261.6 272.5,280.7 256.0,269.8 239.5,280.7 244.8,261.6 229.4,249.3 249.1,248.5" fill="url(#rank-accent)" stroke="#FEF08A" stroke-width="2" stroke-linejoin="round"/>
        
    <g>
      <path d="M 144,267.68 Q 256,308 368,267.68 L 368,285.68 Q 256,326 144,285.68 Z"
            fill="url(#rank-lit)" stroke="url(#rank-stroke)" stroke-width="2" stroke-linejoin="round"/>
    </g>
        
    <g>
      <path d="M 144,293.68 Q 256,334 368,293.68 L 368,311.68 Q 256,352 144,311.68 Z"
            fill="url(#rank-lit)" stroke="url(#rank-stroke)" stroke-width="2" stroke-linejoin="round"/>
    </g>
        
    <g>
      <path d="M 144,319.68 Q 256,360 368,319.68 L 368,337.68 Q 256,378 144,337.68 Z"
            fill="url(#rank-lit)" stroke="url(#rank-stroke)" stroke-width="2" stroke-linejoin="round"/>
    </g>
      
  </g>

  <g id="specular-highlights">
    <!-- Rank Code Cartouche -->
    <polygon points="154,366 358,366 338,414 174,414" fill="#0A0E14" stroke="#10B981" stroke-width="3" stroke-linejoin="round"/>
    <text x="256" y="400" font-family="Roboto" font-weight="900" font-size="30" letter-spacing="3" fill="#F8FAFC" text-anchor="middle">E-7</text>
  </g>
</svg>